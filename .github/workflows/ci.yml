name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minimum-go:
    name: Go 1.27.0 (minimum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache: true
      - name: Verify minimum toolchain
        run: |
          go version
          go mod tidy -diff
          go test ./...
          go vet ./...
          go build ./...

  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify DCO sign-offs
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          ./scripts/check-dco.sh "$base" HEAD
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true
      - name: Verify generated files
        run: |
          make generate
          make fmt
          make license-update
          git diff --exit-code
      - name: Run release checks
        run: make release-check

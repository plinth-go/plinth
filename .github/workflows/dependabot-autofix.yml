name: Dependabot autofix

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: dependabot-autofix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  refresh-notices:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve Dependabot pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER}" ]; then
            PR_NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          fi
          if [ -z "${PR_NUMBER}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No open pull request for ${BRANCH}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          author=$(jq -r '.user.login' <<<"$pr")
          head_repo=$(jq -r '.head.repo.full_name' <<<"$pr")
          if [ "$author" != "dependabot[bot]" ] || [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Pull request #${PR_NUMBER} is not an eligible Dependabot PR." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          failed_release_gate=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" --jq '[.jobs[] | select(.name == "Release gate" and .conclusion == "failure")] | length')
          if [ "$failed_release_gate" -eq 0 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Release gate did not fail in run ${RUN_ID}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Release gate failed on Dependabot PR #${PR_NUMBER}." >> "$GITHUB_STEP_SUMMARY"

      - name: Check out failed commit
        if: steps.pr.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Verify branch is current
        id: current
        if: steps.pr.outputs.run == 'true'
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          remote_sha=$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')
          if [ "$remote_sha" != "$HEAD_SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Branch moved to ${remote_sha:-<missing>}; skipping stale run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check last commit
        id: guard
        if: steps.pr.outputs.run == 'true' && steps.current.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if git log -1 --format=%s | grep -qx 'chore(deps): refresh generated files'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Latest commit is already an autofix commit; skipping to avoid a loop." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.pr.outputs.run == 'true' && steps.current.outputs.skip != 'true' && steps.guard.outputs.skip != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Refresh third-party notices
        if: steps.pr.outputs.run == 'true' && steps.current.outputs.skip != 'true' && steps.guard.outputs.skip != 'true'
        run: make license-update

      - name: Detect generated changes
        id: changes
        if: steps.pr.outputs.run == 'true' && steps.current.outputs.skip != 'true' && steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if git diff --quiet -- THIRD_PARTY_NOTICES.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generated notice changes were needed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- THIRD_PARTY_NOTICES.md
            echo "Updated generated third-party notices." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add THIRD_PARTY_NOTICES.md
          git commit -s -m 'chore(deps): refresh generated files'
          git push origin "HEAD:${BRANCH}"

      - name: Dispatch CI
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          payload=$(jq -nc --arg ref "$BRANCH" '{ref:$ref}')
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            -d "$payload"
          echo "Dispatched CI for ${BRANCH}." >> "$GITHUB_STEP_SUMMARY"
